import groovy.json.JsonSlurper
import groovy.xml.XmlSlurper
plugins {
    id 'fabric-loom' version '1.14.10'
}

def mc = project.minecraft_version

// Yarn-Mappings und Fabric-API: wenn nicht fest eingetragen, die neueste Version fuer 1.21.11 bei Fabric abfragen.
def yarn = project.findProperty('yarn_mappings')
if (!yarn) {
    def list = new JsonSlurper().parse(new URL("https://meta.fabricmc.net/v2/versions/yarn/${mc}"))
    yarn = list.max { it.build }.version
}
def fapi = project.findProperty('fabric_version')
if (!fapi) {
    def xml = new XmlSlurper().parse('https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml')
    def all = xml.versioning.versions.version.collect { it.text() }.findAll { it.endsWith('+' + mc) }
    if (all.isEmpty()) {
        throw new GradleException("Keine Fabric-API fuer ${mc} gefunden - fabric_version in gradle.properties eintragen")
    }
    fapi = all.last()
}
logger.lifecycle("Yarn: ${yarn}   Fabric API: ${fapi}")

version = project.mod_version
group = 'de.timgioh'

base {
    archivesName = project.archives_base_name
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    mappings "net.fabricmc:yarn:${yarn}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fapi}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
